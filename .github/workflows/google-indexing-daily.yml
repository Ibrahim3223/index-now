name: Google Indexing - Daily

on:
  schedule:
    - cron: '0 8 * * *'  # Her gün 08:00 UTC

  workflow_dispatch:
    inputs:
      mode:
        description: 'Indexing mode'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - aggressive

jobs:
  google-indexing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Google credentials
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT }}' > credentials/service-account.json

      - name: Submit sitemaps
        run: |
          cd scripts
          python google_sitemap_submit.py

      - name: Aggressive indexing
        if: ${{ inputs.mode == 'aggressive' }}
        run: |
          cd scripts
          python google_bulk_indexing.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-indexing-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
