name: Google Sitemap Submit

on:
  schedule:
    - cron: '0 6 * * 1'  # Her Pazartesi 06:00 UTC

  workflow_dispatch:

jobs:
  sitemap-submit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Google credentials
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT }}' > credentials/service-account.json

      - name: Submit sitemaps to Google
        run: |
          cd scripts
          python google_sitemap_submit.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-submit-logs-${{ github.run_number }}
          path: logs/
          retention-days: 14
